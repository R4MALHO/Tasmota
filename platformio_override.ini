[platformio]
default_envs = waveshare32s3

[env:waveshare32s3]
extends = env:tasmota32_base
board = esp32s3-qio_qspi

build_flags =
    ${env:tasmota32_base.build_flags}
    -DFIRMWARE_TASMOTA32
    -DUSE_I2C
    -DUSE_TCA9554
    -UUSE_PCA9557
    -DUSE_RULES
    -DUSE_UFILESYS
    -DUSE_SPI
    -DUSE_ETHERNET
    -DUSE_EMULATION
    -DUSE_EMULATION_HUE
