name: Build Waveshare Tasmota

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compilar Tasmota ESP32-S3
        run: |
          platformio run -e tasmota32s3

      - name: Preparar Artifact
        run: |
          mkdir build_output
          find . -name "*.bin"
          cp .pio/build/tasmota32s3/firmware.bin build_output/waveshare-tasmota.bin

      - name: Enviar Firmware
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-tasmota
          path: build_output/waveshare-tasmota.bin
