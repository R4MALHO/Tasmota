name: Build Waveshare Tasmota

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compilar Waveshare ESP32-S3
        run: |
          platformio run -e waveshare32s3

      - name: Localizar firmware
        run: |
          find .pio/build/waveshare32s3 -type f -name "*.bin" -print

      - name: Salvar firmware
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-tasmota
          path: |
            .pio/build/waveshare32s3/*.bin
          if-no-files-found: error
